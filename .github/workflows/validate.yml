name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    name: Skill format and evaluation schema (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '0'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install development validators
        run: python -m pip install -r requirements-dev.txt
      - name: Record Python text encoding
        run: python -c "import locale, sys; print('utf8_mode:', sys.flags.utf8_mode); print('locale:', locale.getencoding())"
      - name: Validate Agent Skills format
        run: skills-ref validate skills/decision-interview
      - name: Validate Codex metadata and evaluation schema
        env:
          PYTHONWARNDEFAULTENCODING: '1'
          PYTHONWARNINGS: error::EncodingWarning
        run: python scripts/validate.py
      - name: Check validator failure detection
        env:
          PYTHONWARNDEFAULTENCODING: '1'
          PYTHONWARNINGS: error::EncodingWarning
        run: python -m unittest discover -s tests
      - name: Check Bash installation from a core.autocrlf=true checkout
        if: runner.os == 'Linux'
        run: |
          git -c core.autocrlf=true clone --quiet . "$RUNNER_TEMP/install-checkout"
          bash "$RUNNER_TEMP/install-checkout/tests/test_install.sh"
      - name: Check PowerShell 7 installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/test_install.ps1
      - name: Check Windows PowerShell 5.1 installation
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/test_install.ps1

  local-links:
    name: Local documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config .lychee.toml --offline --no-progress './**/*.md'
          token: ''
          fail: true
          failIfEmpty: true

  network-links:
    name: External documentation links
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config .lychee.toml --scheme http --scheme https --no-progress './**/*.md'
          token: ''
          fail: true
          failIfEmpty: true
